<style>
  :root{--bg:#050f24;--panel:#0b1a36;--panel2:#10234a;--line:#1d3563;--txt:#eef3f8;--muted:#8fa1b3;
    --cy:#3d8bff;--bl:#0a63ff;--am:#ffffff;--navy:#002863;--sans:'Inter',system-ui,-apple-system,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:var(--sans);color:var(--txt);min-height:100vh;
    padding:calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    background:radial-gradient(700px 420px at 100% -10%,#0a63ff40,transparent 70%),radial-gradient(600px 400px at -10% 25%,#0a63ff1f,transparent 70%),var(--bg)}
  .wrap{max-width:440px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .brand{background:#fff;border-radius:12px;padding:6px 12px;display:flex;align-items:center}
  .brand img{height:34px;display:block}
  .brand svg{width:34px;height:34px}
  .brand small{display:block;font:600 9.5px var(--mono);letter-spacing:.16em;color:var(--cy);margin-top:2px}
  .lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);font:700 11px var(--sans);padding:6px 10px;cursor:pointer}
  .lang button.on{background:#fff;color:#002863}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 30px 70px -30px #000}
  .map{position:relative;height:150px;background:linear-gradient(160deg,#081a3a,#0d2a5a);overflow:hidden}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .live{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:7px;background:#0a0f14cc;border:1px solid #3d8bff66;border-radius:99px;padding:6px 11px;font:700 10px var(--mono);letter-spacing:.14em;color:var(--cy)}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);animation:p 1.6s infinite}
  @keyframes p{50%{opacity:.3}}
  .zone{position:absolute;top:14px;right:14px;text-align:right;font:700 9.5px var(--mono);letter-spacing:.14em;color:#ffffffa0}
  .zone b{display:block;color:#fff;font-size:11.5px}
  .profile{display:flex;gap:14px;align-items:flex-end;padding:0 18px;margin-top:-40px;position:relative}
  .avatar{width:86px;height:86px;border-radius:18px;flex:none;overflow:hidden;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--cy)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .name{font:800 21px/1.1 var(--sans);padding-bottom:4px}
  .role{font-size:12.5px;color:var(--muted);margin-top:4px}
  .role b{color:var(--cy);font-weight:700}
  .bio{padding:14px 18px 0;font-size:14px;line-height:1.55;color:#cfd9e3}
  .primary{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 18px 0;background:linear-gradient(90deg,#0a63ff,#2f7dff);color:#ffffff;border:0;border-radius:12px;padding:15px;font:800 15px var(--sans);text-decoration:none;cursor:pointer}
  .primary svg{width:19px;height:19px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 18px 0}
  .act{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--txt);text-decoration:none;font:600 11px var(--sans);cursor:pointer}
  .act svg{width:21px;height:21px}
  .act:active,.primary:active,.apply:active{transform:scale(.98)}
  .section{padding:24px 18px 0}
  .h{font:700 10.5px var(--mono);letter-spacing:.18em;color:var(--cy);text-transform:uppercase;margin-bottom:10px;display:flex;gap:8px;align-items:center}
  .h::after{content:"";flex:1;height:1px;background:var(--line)}
  .svc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .s{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 12px}
  .s i{font-style:normal;font-size:19px}
  .s b{display:block;font-size:13.5px;margin-top:6px}
  .s small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .hire{background:linear-gradient(150deg,#0e2550,#0b1c3f);border:1px solid #3d8bff55;border-radius:14px;padding:16px}
  .hire h3{font:800 18px var(--sans)}
  .hire p{font-size:13px;color:#cfd9e3;margin-top:6px;line-height:1.5}
  .hire ul{list-style:none;margin-top:10px;display:grid;gap:6px}
  .hire li{font-size:13px;display:flex;gap:8px}
  .hire li::before{content:"✓";color:var(--cy);font-weight:800}
  .apply{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;background:#fff;color:#002863;border-radius:10px;padding:13px;font:800 14px var(--sans);text-decoration:none}
  .vals{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:12.5px;font-weight:600}
  .legal{margin-top:24px;border-top:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:center}
  .legal p{flex:1;font-size:10.5px;color:var(--muted);line-height:1.5}
  .qrbtn{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:700 10px var(--mono);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .qrbtn svg{width:22px;height:22px}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:18px;line-height:1.7}
  .glitch{font:600 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#6b7c8d;margin-top:6px}
  .modal{position:fixed;inset:0;background:#0a0f14d9;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal.on{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:320px;width:100%;text-align:center}
  .sheet h3{font-size:16px;margin-bottom:4px}.sheet p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  #qr{display:flex;justify-content:center;margin:0 auto 14px;padding:10px;background:#fff;border-radius:12px;width:fit-content}
  .btns{display:flex;gap:8px}
  .btns button{flex:1;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:10px;padding:11px;font:700 13px var(--sans);cursor:pointer}
  .btns button.dark{background:var(--cy);color:#ffffff;border-color:var(--cy)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--cy);color:#ffffff;padding:10px 16px;border-radius:99px;font:700 13px var(--sans);opacity:0;transition:.25s;z-index:20}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<style>
.jpnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px 0;-webkit-overflow-scrolling:touch}
.jpnav::-webkit-scrollbar{display:none}
.jpnav a{flex:none;font:600 12px/1 system-ui,-apple-system,sans-serif;color:#ffffffcc;text-decoration:none;padding:8px 12px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff22;white-space:nowrap}
.jpnav a.on{background:#fff;color:#111;border-color:#fff}
.jpnav a.home{padding:8px 10px}
</style>

    wa:"Escríbeme por WhatsApp",call:"Llamar",save:"Guardar",share:"Compartir",
    hSvc:"Qué hacemos",svc:[["📦","Recogida y entrega","Rutas diarias residenciales y comerciales"],["🛒","eCommerce","Entregas a domicilio de alto volumen"],["🦺","Seguridad primero","Conductores capacitados, flota con mantenimiento"],["📍","Florida Central","Condado de Seminole y alrededores"]],
    hHire:"Trabaja con nosotros",hireT:"Buscamos conductores de reparto",hireP:"Únete a un equipo local en crecimiento. Rutas estables, pago semanal o quincenal y bonos por productividad.",
    req:["Licencia de conducir vigente y buen historial de manejo","Mayor de 21 años","Aprobar verificación de antecedentes y prueba de drogas","Responsable, puntual y con buen trato al cliente"],
    apply:"Aplicar por WhatsApp",applyMsg:"Hola, me interesa una posición de conductor de reparto en Navix.",
    hVal:"Cómo trabajamos",vals:["Seguridad","Entregas a tiempo","Cada parada cuenta","Trabajo en equipo","Respeto al cliente"],
    legal:"Navix, Inc. es una empresa independiente que presta servicios de recogida y entrega por contrato. Navix no es FedEx; FedEx® es una marca registrada de FedEx Corporation.",
    foot:"Sanford, Florida",qrTitle:"Escanea para conectar",qrSub:"Apunta la cámara al código para abrir esta página.",copy:"Copiar",close:"Cerrar",
    copied:"Copiado",noshare:"Link copiado para compartir",vSub:"Esta vista previa no permite descargar archivos. Copia los datos o abre la página desde navix.juanpabloconstain.com.",
    waMsg:"Hola Juan Pablo, quiero hablar contigo sobre Navix."}
};
let lang=(navigator.language||"en").toLowerCase().startsWith("es")?"es":"en";
try{const s=localStorage.getItem("nvxLang");if(s)lang=s;}catch(e){}
const $=id=>document.getElementById(id);const full=CARD.first+" "+CARD.last;
const pageUrl=()=>CARD.url||location.href.split("#")[0];
function render(){const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{if(typeof t[el.dataset.t]==="string")el.textContent=t[el.dataset.t];});
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  $("svc").innerHTML=t.svc.map(s=>`<div class="s"><i>${s[0]}</i><b>${s[1]}</b><small>${s[2]}</small></div>`).join("");
  $("req").innerHTML=t.req.map(r=>`<li>${r}</li>`).join("");
  $("vals").innerHTML=t.vals.map(v=>`<span class="chip">${v}</span>`).join("");
  $("waBtn").href="https://wa.me/"+CARD.whatsapp+"?text="+encodeURIComponent(t.waMsg);
  $("applyBtn").href="https://wa.me/"+CARD.whatsapp+"?text="+encodeURIComponent(t.applyMsg);}
$("callBtn").href="tel:"+CARD.phone;$("mailBtn").href="mailto:"+CARD.email;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800);}
async function copy(text,m){try{await navigator.clipboard.writeText(text);toast(m);}catch(e){toast(text);}}
const inViewer=!!(window.claude&&claude.use);
$("saveBtn").onclick=()=>{if(inViewer){$("vmodal").classList.add("on");return;}window.location.href="contact.vcf";};
$("vCopy").onclick=()=>copy(full+"\nNavix, Inc.\n"+CARD.phoneDisplay+"\n"+CARD.email,T[lang].copied);
$("vClose").onclick=()=>$("vmodal").classList.remove("on");
$("shareBtn").onclick=async()=>{try{if(navigator.share){await navigator.share({title:full+" | Navix, Inc.",url:pageUrl()});return;}}catch(e){if(e.name==="AbortError")return;}copy(pageUrl(),T[lang].noshare);};
let qrMade=false;
$("qrBtn").onclick=()=>{$("modal").classList.add("on");if(!qrMade&&window.QRCode){new QRCode($("qr"),{text:pageUrl(),width:200,height:200,colorDark:"#0a0f14",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});qrMade=true;}};
$("closeBtn").onclick=()=>$("modal").classList.remove("on");
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("on");};
$("copyBtn").onclick=()=>copy(pageUrl(),T[lang].copied);
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("nvxLang",lang)}catch(e){}render();});
render();
</script>
