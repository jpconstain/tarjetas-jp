<style>
  :root{--bg:#0c0c0f;--panel:#15151b;--line:#26262f;--txt:#f2f2f5;--muted:#9a9aa8;--sans:'Inter',system-ui,sans-serif;--serif:'Cormorant Garamond',Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:var(--sans);color:var(--txt);min-height:100vh;
    padding:calc(22px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    background:radial-gradient(700px 420px at 15% -5%,#1b2c4a66,transparent 70%),radial-gradient(600px 420px at 100% 10%,#8b5cf622,transparent 70%),radial-gradient(600px 400px at 50% 110%,#b08d5722,transparent 70%),var(--bg)}
  .wrap{max-width:440px;margin:0 auto}
  .top{display:flex;justify-content:flex-end;margin-bottom:10px}
  .lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);font:600 11px var(--sans);padding:6px 10px;cursor:pointer;letter-spacing:.06em}
  .lang button.on{background:var(--txt);color:var(--bg)}
  .hero{text-align:center;padding:6px 0 4px}
  .photo{width:132px;height:132px;border-radius:50%;margin:0 auto;padding:3px;
    background:conic-gradient(from 200deg,#1f4f8f,#8b5cf6,#d4b47c,#1f4f8f)}
  .photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);display:block}
  h1{font:700 34px/1.05 var(--serif);margin-top:16px;letter-spacing:.01em}
  .tag{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.5}
  .loc{display:inline-flex;gap:6px;align-items:center;margin-top:12px;font:600 11px var(--sans);letter-spacing:.14em;color:#cfcfd8;border:1px solid var(--line);border-radius:99px;padding:6px 11px}
  .loc i{width:7px;height:7px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 3px #2fbf7122}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
  .q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;
    color:var(--txt);text-decoration:none;font:600 11px var(--sans);cursor:pointer}
  .q svg{width:21px;height:21px}
  .q.wa svg{color:#25d366}
  .q:active,.biz:active,.save:active{transform:scale(.98)}
  .h{font:600 11px var(--sans);letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:28px 2px 12px}
  .biz{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--txt);border-radius:18px;padding:16px;margin-bottom:10px;
    border:1px solid var(--line);position:relative;overflow:hidden;background:var(--panel)}
  .biz::before{content:"";position:absolute;inset:0;opacity:.9;background:var(--g);z-index:0}
  .biz>*{position:relative;z-index:1}
  .ic{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;background:#ffffff14;border:1px solid #ffffff22}
  .ic svg{width:28px;height:28px}
  .bt{flex:1;min-width:0}
  .bt b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
  .bt span{display:block;font-size:12.5px;color:#ffffffb8;margin-top:3px;line-height:1.35}
  .bt em{display:inline-block;font-style:normal;font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-top:7px;padding:3px 7px;border-radius:6px;background:#00000033;color:#ffffffd0}
  .arr{width:22px;height:22px;opacity:.7;flex:none}
  .rule{--g:linear-gradient(135deg,#0b1a2e,#1d3a66)}
  .ai{--g:linear-gradient(135deg,#1a1033,#3b1f7a 60%,#0f3a44)}
  .crg{--g:linear-gradient(135deg,#1b1813,#3d3324 60%,#5a4a2e)}
  .aba{--g:linear-gradient(135deg,#2a1210,#8f1d17 60%,#b3261e)}
  .save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;background:var(--txt);color:var(--bg);border:0;border-radius:14px;padding:15px;font:700 15px var(--sans);cursor:pointer}
  .save svg{width:18px;height:18px}
  .row{display:flex;gap:8px;margin-top:8px}
  .row button{flex:1;background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font:600 13px var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .row svg{width:17px;height:17px}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:28px;line-height:1.7}
  .foot b{color:var(--txt);font-weight:600}
  .glitch{font:600 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#7c7c8a;margin-top:6px}
  .modal{position:fixed;inset:0;background:#0c0c0fcc;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal.on{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:320px;width:100%;text-align:center}
  .sheet h3{font-size:16px;margin-bottom:4px}
  .sheet p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  #qr{display:flex;justify-content:center;margin:0 auto 14px;padding:10px;background:#fff;border-radius:12px;width:fit-content}
  .btns{display:flex;gap:8px}
  .btns button{flex:1;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:10px;padding:11px;font:700 13px var(--sans);cursor:pointer}
  .btns button.dark{background:var(--txt);color:var(--bg)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);
    padding:10px 16px;border-radius:99px;font:600 13px var(--sans);opacity:0;transition:.25s;z-index:20}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

.jpnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px 0;-webkit-overflow-scrolling:touch}

.jpnav a{flex:none;font:600 12px/1 system-ui,-apple-system,sans-serif;color:#ffffffcc;text-decoration:none;padding:8px 12px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff22;white-space:nowrap}
.jpnav a.on{background:#fff;color:#111;border-color:#fff}
.jpnav a.home{padding:8px 10px}

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800);}
async function copy(text,m){try{await navigator.clipboard.writeText(text);toast(m);}catch(e){toast(text);}}
function vcard(){return["BEGIN:VCARD","VERSION:3.0",`N:${CARD.last};${CARD.first};;;`,`FN:${full}`,
  `TEL;TYPE=CELL,VOICE:${CARD.phone}`,`EMAIL;TYPE=WORK:${CARD.email}`,`URL:${CARD.website}`,`URL;TYPE=LinkedIn:${CARD.linkedin}`,
  `NOTE:Rule Logistics · Mohahub · Constain Realty Group · Fibraplas Concrete`,"END:VCARD"].join("\r\n");}
const inViewer=!!(window.claude&&claude.use);
const dlP=inViewer?Promise.race([claude.use("downloads").catch(()=>null),new Promise(r=>setTimeout(()=>r(null),8000))]):Promise.resolve(null);
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
$("saveBtn").onclick=async()=>{const fname="Juan_Pablo_Constain.vcf",data=vcard();
  if(inViewer){const dl=await dlP;if(dl){try{await dl.save({filename:fname,data});toast(T[lang].saved);}catch(e){}return;}$("vmodal").classList.add("on");return;}
  window.location.href="contact.vcf"; return;toast(T[lang].saved);};
$("vCopy").onclick=()=>copy(full+"\n"+CARD.phoneDisplay+"\n"+CARD.email+"\n"+CARD.website,T[lang].copied);
$("vClose").onclick=()=>$("vmodal").classList.remove("on");
$("shareBtn").onclick=async()=>{try{if(navigator.share){await navigator.share({title:full,url:pageUrl()});return;}}catch(e){if(e.name==="AbortError")return;}copy(pageUrl(),T[lang].noshare);};
let qrMade=false;
$("qrBtn").onclick=()=>{$("modal").classList.add("on");if(!qrMade&&window.QRCode){new QRCode($("qr"),{text:pageUrl(),width:200,height:200,colorDark:"#0c0c0f",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});qrMade=true;}};
$("closeBtn").onclick=()=>$("modal").classList.remove("on");
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("on");};
$("copyBtn").onclick=()=>copy(pageUrl(),T[lang].copied);
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("hubLang",lang)}catch(e){}render();});
render();
</script>
</body>
</html>
