<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fibraplas Concrete | Juan Pablo Constain — Abacol</title>
<meta name="description" content="Fibraplas Concrete: fibra para pisos de concreto que reemplaza la malla electrosoldada. Representante: Juan Pablo Constain.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#1a1716">
<meta property="og:title" content="Fibraplas Concrete | Juan Pablo Constain">
<meta property="og:description" content="Reemplace la malla electrosoldada en sus pisos de concreto. Cotice con su representante.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1a1716;--panel:#232020;--panel2:#2b2726;--line:#3a3433;--txt:#f5f1ec;--muted:#b3a9a2;
    --red:#b3261e;--red2:#8f1d17;--yel:#f1b83a;--concrete:#8d8a86;--sans:'Archivo',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:var(--sans);color:var(--txt);min-height:100vh;
    padding:calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    background:radial-gradient(700px 400px at 100% -10%,#b3261e33,transparent 70%),radial-gradient(600px 400px at -10% 30%,#f1b83a14,transparent 70%),var(--bg)}
  .wrap{max-width:440px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .brand{font:900 13px var(--sans);letter-spacing:.2em}
  .brand small{display:block;font:500 9.5px var(--mono);letter-spacing:.14em;color:var(--yel);margin-top:3px}
  .lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);font:700 11px var(--sans);padding:6px 10px;cursor:pointer}
  .lang button.on{background:var(--yel);color:#1a1716}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 30px 70px -30px #000}
  .hero{position:relative;padding:22px 18px 20px;background:linear-gradient(150deg,var(--red),var(--red2));overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;
    background:repeating-linear-gradient(45deg,#ffffff10 0 6px,transparent 6px 14px)}
  .eyebrow{font:700 10px var(--mono);letter-spacing:.18em;color:var(--yel);text-transform:uppercase;position:relative}
  .hero h1{font:900 29px/1.02 var(--sans);letter-spacing:-.01em;margin-top:10px;text-transform:uppercase;position:relative}
  .hero h1 span{color:var(--yel)}
  .save{display:inline-flex;align-items:baseline;gap:8px;margin-top:14px;background:#1a1716cc;border:1px solid #ffffff22;border-radius:12px;padding:10px 14px;position:relative}
  .save b{font:900 30px var(--sans);color:var(--yel)}
  .save span{font:600 12.5px/1.3 var(--sans);max-width:170px}
  .fn{font-size:10px;color:#ffffffa8;margin-top:8px;position:relative;line-height:1.4}
  .profile{display:flex;gap:14px;align-items:center;padding:18px 18px 4px}
  .avatar{width:72px;height:72px;border-radius:14px;flex:none;overflow:hidden;border:2px solid var(--yel)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .name{font:800 20px/1.1 var(--sans)}
  .role{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35}
  .role b{color:var(--yel);font-weight:700}
  .primary{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 18px 0;background:var(--yel);color:#1a1716;border:0;border-radius:12px;padding:15px;font:800 15px var(--sans);text-decoration:none;cursor:pointer}
  .primary svg{width:20px;height:20px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 18px 0}
  .act{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--txt);text-decoration:none;font:600 11px var(--sans);cursor:pointer}
  .act svg{width:21px;height:21px}
  .act:active,.primary:active{transform:scale(.98)}
  .section{padding:24px 18px 0}
  .h{font:700 10.5px var(--mono);letter-spacing:.18em;color:var(--yel);text-transform:uppercase;margin-bottom:10px;display:flex;gap:8px;align-items:center}
  .h::after{content:"";flex:1;height:1px;background:var(--line)}
  .desc{font-size:14px;line-height:1.55;color:#ddd5ce}
  .ben{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .b{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 12px}
  .b i{font-style:normal;font-size:19px}
  .b strong{display:block;font-size:13.5px;margin-top:6px;font-weight:700}
  .b small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .vs{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vs th,.vs td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .vs tr:last-child td{border-bottom:0}
  .vs th{font:700 10px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .vs td:nth-child(2){color:var(--yel);font-weight:600}.vs td:nth-child(3){color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:12.5px;font-weight:600}
  .steps{display:grid;gap:6px}
  .st{display:flex;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .st .n{font:700 11px var(--mono);background:var(--red);color:#fff;border-radius:6px;padding:3px 7px;height:fit-content}
  .st b{font-size:13.5px}
  .st small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .about{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .about .yr{font:900 22px var(--sans);color:var(--yel);flex:none}
  .about p{font-size:12.5px;color:#ddd5ce;line-height:1.45}
  .fn2{font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:8px}
  .ex td:nth-child(2){color:var(--yel);font-weight:800}.spec td:nth-child(3){color:var(--txt)}
  .vs td:first-child{font-weight:700;color:var(--txt)}
  .dl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dl a{background:var(--panel2);border:1px solid var(--yel);border-radius:12px;padding:12px;text-align:center;color:var(--txt);text-decoration:none;font-weight:700;font-size:13px}
  .prod{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
  .prod figure,.gal figure{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .prod img,.gal img{width:100%;display:block;object-fit:cover}
  .prod img{height:170px}.prod figure:nth-child(2) img{object-fit:contain;background:#fff}.gal img{height:120px}
  figcaption{font-size:11px;color:var(--muted);padding:7px 9px;line-height:1.3}
  .gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .legal{margin-top:24px;border-top:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:center}
  .legal p{flex:1;font-size:10.5px;color:var(--muted);line-height:1.5}
  .qrbtn{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:700 10px var(--mono);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .qrbtn svg{width:22px;height:22px}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:18px;line-height:1.7}
  .glitch{font:600 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#8a807a;margin-top:6px}
  .modal{position:fixed;inset:0;background:#1a1716d9;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal.on{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:320px;width:100%;text-align:center}
  .sheet h3{font-size:16px;margin-bottom:4px}.sheet p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  #qr{display:flex;justify-content:center;margin:0 auto 14px;padding:10px;background:#fff;border-radius:12px;width:fit-content}
  .btns{display:flex;gap:8px}
  .btns button{flex:1;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:10px;padding:11px;font:700 13px var(--sans);cursor:pointer}
  .btns button.dark{background:var(--yel);color:#1a1716;border-color:var(--yel)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--yel);color:#1a1716;padding:10px 16px;border-radius:99px;font:700 13px var(--sans);opacity:0;transition:.25s;z-index:20}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

    pack:"Water-soluble packs of approx. 5 oz (143 g), added directly to the mix. Boxes of 53 lb (24 kg) with approx. 168 packs. Box size: 9.8 × 19 × 12 in (25 × 48 × 30 cm).",
    notes:"*Savings estimated from manufacturer comparisons; actual savings depend on each project's design, local pricing and labor. **Manufacturer data. Technical information is for guidance only and does not replace the project's structural design.",
    hProd:"The product",capRoll:"Structural synthetic macro fiber",capBox:"53 lb box · approx. 168 soluble packs",hGal:"On site",cap1:"Industrial floor",cap2:"Ready-mix pour",cap3:"Slab on steel deck",cap4:"Finished warehouse",
    wa:"Hi Juan Pablo, I'd like a quote for Fibraplas Concrete for a concrete floor."}
};
let lang=(navigator.language||"es").toLowerCase().startsWith("es")?"es":"en";
try{const s=localStorage.getItem("abaLang");if(s)lang=s;}catch(e){}
const $=id=>document.getElementById(id);const full=CARD.first+" "+CARD.last;
const pageUrl=()=>CARD.url||location.href.split("#")[0];
function render(){const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{if(typeof t[el.dataset.t]==="string")el.textContent=t[el.dataset.t];});
  document.querySelector("[data-h=h1]").innerHTML=t.h1;
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  $("ben").innerHTML=t.ben.map(b=>`<div class="b"><i>${b[0]}</i><strong>${b[1]}</strong><small>${b[2]}</small></div>`).join("");
  const tbl=(id,rows)=>{$(id).innerHTML=rows.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")+"</tr>").join("");};tbl("ex",t.exT);tbl("spec",t.spec);
  $("vs").innerHTML=t.vs.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")+"</tr>").join("");
  $("uses").innerHTML=t.uses.map(u=>`<span class="chip">${u}</span>`).join("");
  $("steps").innerHTML=t.steps.map((s,i)=>`<div class="st"><span class="n">0${i+1}</span><div><b>${s[0]}</b><small>${s[1]}</small></div></div>`).join("");
  $("quoteBtn").href="https://wa.me/"+CARD.whatsapp+"?text="+encodeURIComponent(t.wa);}
$("callBtn").href="tel:"+CARD.phone;$("mailBtn").href="mailto:"+CARD.email+"?subject="+encodeURIComponent("Fibraplas Concrete");
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800);}
async function copy(text,m){try{await navigator.clipboard.writeText(text);toast(m);}catch(e){toast(text);}}
const inViewer=!!(window.claude&&claude.use);
$("saveBtn").onclick=()=>{if(inViewer){$("vmodal").classList.add("on");return;}window.location.href="contact.vcf";};
$("vCopy").onclick=()=>copy(full+"\nFibraplas Concrete · Abacol\n"+CARD.phoneDisplay+"\n"+CARD.email,T[lang].copied);
$("vClose").onclick=()=>$("vmodal").classList.remove("on");
$("shareBtn").onclick=async()=>{try{if(navigator.share){await navigator.share({title:"Fibraplas Concrete | "+full,url:pageUrl()});return;}}catch(e){if(e.name==="AbortError")return;}copy(pageUrl(),T[lang].noshare);};
let qrMade=false;
$("qrBtn").onclick=()=>{$("modal").classList.add("on");if(!qrMade&&window.QRCode){new QRCode($("qr"),{text:pageUrl(),width:200,height:200,colorDark:"#1a1716",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});qrMade=true;}};
$("closeBtn").onclick=()=>$("modal").classList.remove("on");
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("on");};
$("copyBtn").onclick=()=>copy(pageUrl(),T[lang].copied);
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("abaLang",lang)}catch(e){}render();});
render();
</script>
