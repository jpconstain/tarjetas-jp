let lang = (navigator.language||"es").toLowerCase().startsWith("es") ? "es" : "en";
try{ const s=localStorage.getItem("crgLang"); if(s) lang=s; }catch(e){}

const $ = id => document.getElementById(id);
const full = CARD.first+" "+CARD.last;
const pageUrl = () => CARD.url || location.href.split("#")[0];

function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ if(typeof t[el.dataset.t]==="string") el.textContent=t[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  $("services").innerHTML = t.svc.map(s=>`<div class="s">${ICON[s[0]]}<b>${s[1]}</b><small>${s[2]}</small></div>`).join("");
  $("badges").innerHTML = t.badges.map(b=>`<div class="badge"><b>${b[0]}</b><small>${b[1]}</small></div>`).join("");
}
function init(){
  $("name").textContent=full; $("licNo").textContent=CARD.license;
  $("avatar").innerHTML = CARD.photo ? `<img src="${CARD.photo}" alt="${full}">` : "JPC";
  $("fPhone").innerHTML=`<a href="tel:${CARD.phone}">${CARD.phoneDisplay}</a>`;
  $("fMail").innerHTML=`<a href="mailto:${CARD.email}">${CARD.email}</a>`;
  $("fAddr").textContent=CARD.address;
  $("fIg").innerHTML = CARD.instagram ? `<a href="https://instagram.com/${CARD.instagram}" target="_blank" rel="noopener">@${CARD.instagram}</a>` : "—";
  $("waBtn").href="https://wa.me/"+CARD.whatsapp; $("callBtn").href="tel:"+CARD.phone; $("mailBtn").href="mailto:"+CARD.email;
  $("searchBtn").href=CARD.search; $("valBtn").href=CARD.valuation;
  $("areas").innerHTML = CARD.areas.map(a=>`<span class="area">${a}</span>`).join("");
  $("legalName").textContent=CARD.company+" · Licensed Real Estate Broker";
  $("legalLine").textContent=CARD.address+" · Lic. "+CARD.license;
  render();
}
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }
async function copy(text,m){ try{ await navigator.clipboard.writeText(text); toast(m); }catch(e){ toast(text); } }
function vcard(){
  return ["BEGIN:VCARD","VERSION:3.0",`N:${CARD.last};${CARD.first};;;`,`FN:${full}`,`ORG:${CARD.company}`,
    `TITLE:${lang==="es"?"Broker & Fundador":"Broker & Founder"}`,`TEL;TYPE=CELL,VOICE:${CARD.phone}`,`EMAIL;TYPE=WORK:${CARD.email}`,
    `URL:${CARD.website}`,`ADR;TYPE=WORK:;;${CARD.address};;;;`,`NOTE:Licensed Real Estate Broker · ${CARD.license} · Buy · Sell · Invest`,"END:VCARD"].join("\r\n");
}
const inViewer = !!(window.claude && claude.use);
const dlP = inViewer ? Promise.race([claude.use("downloads").catch(()=>null), new Promise(r=>setTimeout(()=>r(null),8000))]) : Promise.resolve(null);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
$("saveBtn").onclick = async ()=>{
  const fname=full.replace(/\s+/g,"_")+"_CRG.vcf", data=vcard();
  if(inViewer){ const dl=await dlP;
    if(dl){ try{ await dl.save({filename:fname,data}); toast(T[lang].saved); }catch(e){} return; }
    $("vmodal").classList.add("on"); return; }
  window.location.href="contact.vcf"; return; toast(T[lang].saved);
};
$("vCopy").onclick=()=>copy(full+"\n"+CARD.company+"\n"+CARD.phoneDisplay+"\n"+CARD.email+"\n"+CARD.website,T[lang].copied);
$("vClose").onclick=()=>$("vmodal").classList.remove("on");
$("shareBtn").onclick=async()=>{
  try{ if(navigator.share){ await navigator.share({title:full+" | Constain Realty Group",text:T[lang].role,url:pageUrl()}); return; } }catch(e){ if(e.name==="AbortError") return; }
  copy(pageUrl(),T[lang].noshare);
};
let qrMade=false;
$("qrBtn").onclick=()=>{ $("modal").classList.add("on");
  if(!qrMade && window.QRCode){ new QRCode($("qr"),{text:pageUrl(),width:200,height:200,colorDark:"#111111",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); qrMade=true; } };
$("closeBtn").onclick=()=>$("modal").classList.remove("on");
$("modal").onclick=e=>{ if(e.target.id==="modal") $("modal").classList.remove("on"); };
$("copyBtn").onclick=()=>copy(pageUrl(),T[lang].copied);
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{ lang=b.dataset.l; try{localStorage.setItem("crgLang",lang)}catch(e){} render(); });
init();
</script>
</body>
</html>
